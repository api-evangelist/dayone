name: DayOne
description: 'DayOne is a hyperscale data center company delivering next-generation digital infrastructure
  for cloud, AI, and edge computing workloads. Spun out of the GDS International business and backed by
  SoftBank Vision Fund 2, DayOne develops and operates strategically located, interconnected data center
  campuses across Asia-Pacific — Singapore, Johor (Malaysia), Batam (Indonesia), Hong Kong, Tokyo, and
  Bangkok — and is expanding into Europe with a launch market in Finland. The company positions itself
  as a build-to-suit and hyperscale partner focused on power availability, connectivity, and sustainable
  operations rather than as a public API or developer-platform provider; there is no public developer
  portal, API, or SDK surface at this time.'
